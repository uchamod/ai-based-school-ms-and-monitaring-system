spring.application.name=sclms-auth-service
server.port=8080
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/sclMs?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
#Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
#Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Fail fast on serialization errors
spring.kafka.producer.properties.spring.json.fail-on-empty-beans=false
spring.kafka.producer.properties.spring.json.write-dates-as-timestamps=false
# Enable type info in Kafka message headers
spring.kafka.producer.properties.spring.json.add.type.headers=true