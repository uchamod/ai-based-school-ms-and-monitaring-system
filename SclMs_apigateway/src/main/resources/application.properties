spring.application.name=SclMs_apigateway
server.port=8090


# Default Filters
#spring.cloud.gateway.server.webflux.default-filters=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Global CORS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# Gateway Routes

# --------------------------------------------------------------------------------------

#Auth service
spring.cloud.gateway.server.webflux.routes[0].id=SCLMS-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=SCLMS-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/authoption/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AuthenticationFilter

spring.cloud.gateway.server.webflux.routes[2].id=SCLMS_SCHOOL_SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/school/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthenticationFilter

spring.cloud.gateway.server.webflux.routes[3].id=SCLMS_SCHOOL_SERVICE
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cache/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=AuthenticationFilter

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# Redis Connection Pool
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

# Logging
logging.level.com.example.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.data.redis=DEBUG

# Resilience4j Rate Limiting
resilience4j.ratelimiter.limiters.default.limit-for-period=100
resilience4j.ratelimiter.limiters.default.limit-refresh-period=1m
resilience4j.ratelimiter.limiters.default.timeout-duration=1s


